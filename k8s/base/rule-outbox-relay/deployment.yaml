apiVersion: apps/v1
kind: Deployment
metadata:
  name: realrisk-rule-outbox-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: realrisk-rule-outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realrisk-rule-outbox-relay
    spec:
      containers:
        - name: rule-outbox-relay
          image: realrisk-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: realrisk-api-gateway-config
          env:
            - name: APPLICATION_WORKERS_ENABLED
              value: "false"
            - name: RISK_WORKER_ENABLED
              value: "false"
            - name: RULE_OUTBOX_PUBLISHER_ENABLED
              value: "true"
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: realrisk-admin-api-key
                  key: api-key
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: realrisk-cluster-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: realrisk-cluster-app
                  key: password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
