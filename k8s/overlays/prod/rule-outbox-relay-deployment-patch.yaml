apiVersion: apps/v1
kind: Deployment
metadata:
  name: realrisk-rule-outbox-relay
spec:
  template:
    spec:
      containers:
        - name: rule-outbox-relay
          image: realrisk-api:latest
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
